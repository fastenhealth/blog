---
layout: default
---
<section class="standard-page">
    <div class="shell page-with-sidebar">
        <div>
            <header class="page-header">
                <span class="eyebrow">Fasten Health</span>
                <h1>{{ page.title }}</h1>
            </header>
            {% if page.image %}
            <img class="page-cover" src="{% if page.image contains '://' %}{{ page.image }}{% else %}{{ page.image | absolute_url }}{% endif %}" alt="{{ page.title }}">
            {% endif %}
            <div class="page-content article-content">{{ content }}</div>
            {% if page.comments == true %}{% include comments.html %}{% endif %}
        </div>
        <aside class="page-sidebar">{% include sidebar.html %}</aside>
    </div>
</section>
