---
title: "Categories"
layout: default
permalink: "/categories.html"
---
<section class="standard-page">
    <div class="shell">
        <header class="page-header"><span class="eyebrow">Browse the archive</span><h1>Categories</h1></header>
        {% for category in site.categories %}
        <section class="archive-section" id="{{ category[0] | downcase }}">
            <h2>{{ category[0] }}</h2>
            <div class="archive-grid">
                {% for post in category[1] %}{% include main-loop-card.html %}{% endfor %}
            </div>
        </section>
        {% endfor %}
    </div>
</section>
