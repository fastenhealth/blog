---
title: "Authors"
layout: default
permalink: "/authors-list.html"
---
<section class="standard-page">
    <div class="narrow-shell">
        <header class="page-header"><span class="eyebrow">Fasten Health</span><h1>Authors</h1></header>
        {% for author in site.authors %}
        <div class="author-profile">
            <img src="{{ site.baseurl }}/{{ author[1].avatar }}" alt="{{ author[1].name }}">
            <div>
                <h1>{{ author[1].name }}</h1>
                <p>{{ author[1].bio }}</p>
                <p><a href="{{ site.baseurl }}/author-{{ author[0] }}.html">View posts</a></p>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
