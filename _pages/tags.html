---
title: "Tags"
layout: default
permalink: "/tags.html"
---
<section class="standard-page">
    <div class="shell">
        <header class="page-header"><span class="eyebrow">Browse the archive</span><h1>Tags</h1></header>
        {% for tag in site.tags %}
        <section class="archive-section" id="{{ tag[0] | downcase }}">
            <h2>{{ tag[0] }}</h2>
            <div class="archive-grid">
                {% for post in tag[1] %}{% include main-loop-card.html %}{% endfor %}
            </div>
        </section>
        {% endfor %}
    </div>
</section>
